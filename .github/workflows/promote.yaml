# Promote a gated model version to `champion`. This workflow is the only thing that moves the alias.
# Runs in the `production` environment: a required reviewer approves before the job starts.
name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Model version to promote (empty: whatever `challenger` points at)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, lab-app]
    environment: production
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Move the champion alias
        # Runs in the serving image (it has mlflow) on the lab network. The version must carry the
        # evaluation tags the pipeline writes; the outgoing champion is recorded as a tag on the new one.
        run: |
          img=$(docker inspect lab-serving-serving-challenger-1 --format '{{.Config.Image}}')
          docker run --rm -i --network lab -e MLFLOW_TRACKING_URI -e VERSION --entrypoint python "$img" - <<'PY' | tee /tmp/promote.out
          import os, sys
          from mlflow import MlflowClient

          name = "trip-duration"
          c = MlflowClient()
          version = os.environ.get("VERSION") or c.get_model_version_by_alias(name, "challenger").version
          mv = c.get_model_version(name, str(version))
          # Only a version the pipeline evaluated and gated (contracts/mlflow.yaml version_tags).
          required = ("training_window", "holdout_month", "features_version", "mae_min", "p95_latency_ms", "champion_mae_min")
          missing = [k for k in required if k not in mv.tags]
          if missing:
              sys.exit(f"version {version} lacks tags {missing}: not from the pipeline")
          if not float(mv.tags["mae_min"]) < float(mv.tags["champion_mae_min"]):
              sys.exit(f"version {version} did not beat what it was compared with ({mv.tags['mae_min']} vs {mv.tags['champion_mae_min']})")
          try:
              old = c.get_model_version_by_alias(name, "champion").version
          except Exception:
              old = "none"
          if old != str(version):
              # The registered model's previous_champion tag is what a rollback promotes again.
              c.set_registered_model_tag(name, "previous_champion", old)
              c.set_registered_model_alias(name, "champion", str(version))
          print(f"PROMOTED {version} OUTGOING {old}")
          PY
          read -r _ v _ old < <(tail -1 /tmp/promote.out)
          echo "### champion: v$old -> v$v (rollback: run promote with version $old)" >> "$GITHUB_STEP_SUMMARY"
      - name: Make serving use it
        # Decision 010: hot reload. serving-champion keeps answering with the old version until the new
        # one has loaded, so riders never see a gap.
        run: |
          version=$(sed -n 's/^PROMOTED \([^ ]*\) .*/\1/p' /tmp/promote.out)
          deploy/web.sh reload champion | tee /tmp/reload.json
          jq -e --arg v "$version" '.version == $v' /tmp/reload.json >/dev/null
      - name: Check /predict answers with the new champion
        run: |
          version=$(sed -n 's/^PROMOTED \([^ ]*\) .*/\1/p' /tmp/promote.out)
          # Traefik health-checks serving every 5s, so a fresh champion can take a few seconds to get traffic.
          for attempt in $(seq 1 12); do
            body=$(curl -fsS -m 10 -H 'Content-Type: application/json' http://localhost/predict \
              -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}' || true)
            echo "attempt $attempt: $body"
            if jq -e --arg v "$version" '.model.alias == "champion" and .model.version == $v' <<<"$body" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "/predict never answered with champion v$version" >&2
          exit 1
