# A successful run from this repository's main branch deploys on the app host.
# Never run fork PR code on a self-hosted runner with the LabInstanceProfile.
name: app-deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy by hand, e.g. an older commit SHA (default: the commit this run is on)"
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, lab-app]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Blue-green deploy of the exact CI image
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TAG: ${{ inputs.tag }}
          LLM_HOST: ${{ vars.LLM_HOST }}  # S6: the assistant's LLM host; compose.web.yaml passes it to the app
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare
          live=$(deploy/web.sh live)
          # Deploy to the idle colour. First deploy (live=none): blue.
          if [[ "$live" == blue ]]; then target=green other=blue; else target=blue other=green; fi
          echo "live=$live target=$target" | tee -a "$GITHUB_STEP_SUMMARY"
          # The colour that isn't being deployed keeps the tag it runs now.
          other_tag=$(deploy/web.sh tag "$other")
          tag="${TAG:-$COMMIT_SHA}"
          if [[ "$target" == blue ]]; then export BLUE_TAG="$tag" GREEN_TAG="$other_tag"
          else export GREEN_TAG="$tag" BLUE_TAG="$other_tag"; fi
          docker compose -f deploy/compose.web.yaml pull "app-$target"
          docker compose -f deploy/compose.web.yaml up -d --wait --no-deps --remove-orphans "app-$target"
      - name: Smoke test the idle colour
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          live=$(deploy/web.sh live)
          if [[ "$live" == blue ]]; then target=green; else target=blue; fi
          # A tag picked by hand (a rollback to an older image) can't be checked against this commit.
          if [[ -n "$TAG" ]]; then deploy/web.sh smoke "$target"; else deploy/web.sh smoke "$target" "$COMMIT_SHA"; fi
      - name: Switch traffic (the old colour keeps running for rollback)
        # decisions/011-switch-trigger.md: a passing smoke test flips it automatically.
        run: |
          live=$(deploy/web.sh live)
          if [[ "$live" == blue ]]; then target=green; else target=blue; fi
          deploy/web.sh switch "$target"
          deploy/web.sh status | tee -a "$GITHUB_STEP_SUMMARY"
