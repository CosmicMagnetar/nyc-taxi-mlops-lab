# A successful run from this repository's main branch deploys on the app host.
# Never run fork PR code on a self-hosted runner with the LabInstanceProfile.
name: app-deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the exact CI image
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="$COMMIT_SHA"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
          actual=$(curl -fsS --retry 10 --retry-all-errors --retry-delay 3 \
            http://127.0.0.1/version | jq -r .git_sha)
          test "$actual" = "$COMMIT_SHA"
