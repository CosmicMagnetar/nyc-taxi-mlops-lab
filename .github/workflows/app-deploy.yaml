# A successful run from this repository's main branch deploys on the app host.
# Never run fork PR code on a self-hosted runner with the LabInstanceProfile.
name: app-deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, lab-app]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Blue-green deploy of the exact CI image
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare
          live=$(deploy/web.sh live)
          # Deploy to the idle colour. First deploy (live=none): blue.
          if [[ "$live" == blue ]]; then target=green other=blue; else target=blue other=green; fi
          echo "live=$live target=$target" | tee -a "$GITHUB_STEP_SUMMARY"
          # The colour that isn't being deployed keeps the tag it runs now.
          other_tag=$(deploy/web.sh tag "$other")
          if [[ "$target" == blue ]]; then export BLUE_TAG="$COMMIT_SHA" GREEN_TAG="$other_tag"
          else export GREEN_TAG="$COMMIT_SHA" BLUE_TAG="$other_tag"; fi
          docker compose -f deploy/compose.web.yaml pull "app-$target"
          docker compose -f deploy/compose.web.yaml up -d --wait --no-deps --remove-orphans "app-$target"
      - name: Smoke test the idle colour
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          live=$(deploy/web.sh live)
          if [[ "$live" == blue ]]; then target=green; else target=blue; fi
          deploy/web.sh smoke "$target" "$COMMIT_SHA"
      - name: Switch traffic (the old colour keeps running for rollback)
        # DECISION POINT (decisions/: what triggers the switch). This is a placeholder: a passing smoke
        # test flips it automatically. Change it to what you decide.
        run: |
          live=$(deploy/web.sh live)
          if [[ "$live" == blue ]]; then target=green; else target=blue; fi
          deploy/web.sh switch "$target"
          deploy/web.sh status | tee -a "$GITHUB_STEP_SUMMARY"
