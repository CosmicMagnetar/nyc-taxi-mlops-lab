# Static gate for every branch and pull request. No self-hosted runner is exposed to PR code.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: make check

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the arm64 app image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/app:${COMMIT_SHA}"
          docker buildx build --platform linux/arm64 \
            --build-arg "GIT_SHA=${COMMIT_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$image" --push app
