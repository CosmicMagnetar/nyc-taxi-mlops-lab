# Roll the app back by switching traffic to the other colour, which still runs the previous version.
# A reviewed click, like promotion: the `production` environment waits for its required reviewer.
name: rollback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, lab-app]
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Switch to the other colour
        run: |
          start=$(date +%s)
          live=$(deploy/web.sh live)
          if [[ "$live" == blue ]]; then target=green; elif [[ "$live" == green ]]; then target=blue; else
            echo "no live colour yet, nothing to roll back" >&2; exit 1; fi
          [[ "$(deploy/web.sh tag "$target")" != none ]] || { echo "$target runs nothing" >&2; exit 1; }
          deploy/web.sh smoke "$target"
          deploy/web.sh switch "$target"
          echo "rolled back $live -> $target in $(( $(date +%s) - start ))s (after approval)" | tee -a "$GITHUB_STEP_SUMMARY"
          deploy/web.sh status | tee -a "$GITHUB_STEP_SUMMARY"
