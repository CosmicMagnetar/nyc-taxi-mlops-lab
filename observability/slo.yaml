# Service level objectives for the ride app (S5, decision 013). rules/slo.rules.yaml computes them.
# One entry per SLO: what's measured (the SLI, from contracts/metrics.yaml), the objective, why that
# number, and the alert that tells you it's being missed. Window for every objective: 30 days.
slos:
  - name: predict-availability
    sli: "share of /predict requests that did not answer 5xx: 1 - rate(lab_http_requests_total{route=/predict,code=~5..}) / rate(lab_http_requests_total{route=/predict})"
    objective: "99.5% over 30 days (error budget 0.5%, about 3.6 hours)"
    why: "A rider who gets a 5xx gets no quote at all, so this is the failure they notice first. 99.5% not 99.9%: this is one app host with blue-green deploys, and 99.9% (43 minutes) would be spent by one bad deploy or the Traefik hang from S3."
    alert: "PredictAvailabilityFastBurn pages at 14.4x burn on 1h and 5m together; PredictAvailabilitySlowBurn tickets at 6x on 6h and 30m."
  - name: predict-latency
    sli: "share of /predict requests answered in 250ms or less: rate(lab_http_request_duration_seconds_bucket{route=/predict,le=0.25}) / rate(lab_http_request_duration_seconds_count{route=/predict})"
    objective: "95% of requests under 250ms over 30 days"
    why: "A quote that arrives late is a failed quote to a rider. 250ms is a bucket edge in the contract, so the SLI is exact and needs no interpolation; a percentile from a histogram, not an average, because the average hides the slow tail."
    alert: "PredictLatencyFastBurn pages at 6x burn on 1h and 5m together."
  - name: model-answers
    sli: "share of quotes produced by the model, not the static fallback: 1 - rate(lab_predictions_total{source=fallback}) / rate(lab_predictions_total)"
    objective: "95% of quotes from the model over 30 days (OPEN: the number is the agent's placeholder, student to confirm in decision 013)"
    why: "The fallback keeps /predict answering, so availability stays green while riders get a worse quote. Without this SLO a dead serving container is invisible."
    alert: "ModelFallbackFastBurn pages at 6x burn on 1h and 5m together."
